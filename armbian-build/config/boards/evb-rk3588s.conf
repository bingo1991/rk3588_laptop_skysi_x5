# Rockchip RK3588s SoC octa core 8GB SoC eMMC USB2
BOARD_NAME="evb-rk3588s"
BOARD_VENDOR="rockchip"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="bingo1991"
INTRODUCED="2026"
BOOTCONFIG="roc-pc-rk3588s_defconfig"
KERNEL_TARGET="edge,vendor,current"
KERNEL_TEST_TARGET="vendor,current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588s-evb1-v10.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SOC="rk3588"
IMAGE_PARTITION_TABLE="gpt"

function post_family_tweaks__evbrk3588s_naming_audios() {
	display_alert "$BOARD" "Renaming evb-rk3588s audios" "info"

	mkdir -p $SDCARD/etc/udev/rules.d/
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8388-sound", ENV{SOUND_DESCRIPTION}="ES8388 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules

	return 0
}

# Rockchip RK3588 SoC octa core 16GB SoC eMMC USB3 NvME
BOARD_NAME="Skysi X5"
BOARD_VENDOR="skysi"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="bingo1991"
INTRODUCED="2026"
BOOT_SOC="rk3588"
BOOTCONFIG="skysi-x5_defconfig"
KERNEL_TARGET="edge,vendor,current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588-skysi-x5.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
IMAGE_PARTITION_TABLE="gpt"
declare -g UEFI_EDK2_BOARD_ID="skysi-x5" # This _only_ used for uefi-edk2-rk3588 extension

function post_family_tweaks__skysix5_naming_audios() {
	display_alert "$BOARD" "Naming skysix5 audios with WirePlumber rules" "info"

	# Remove the ineffective udev SOUND_DESCRIPTION rule from older builds
	rm -f "$SDCARD/etc/udev/rules.d/90-naming-audios.rules"

	mkdir -p "$SDCARD/etc/wireplumber/wireplumber.conf.d/"
	cat > "$SDCARD/etc/wireplumber/wireplumber.conf.d/51-skysi-names.conf" <<'EOF'
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-analog-sound" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Speaker / Headphone (ES8326)"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.platform-analog-sound.*" }
    ]
    actions = {
      update-props = {
        node.description = "Speaker / Headphone"
        device.profile.description = "Speaker / Headphone"
        node.nick = "speaker-headphone"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_input.platform-analog-sound.*" }
    ]
    actions = {
      update-props = {
        node.description = "Internal Microphone"
        device.profile.description = "Internal Microphone"
        node.nick = "microphone"
      }
    }
  },
  {
    matches = [
      { device.name = "alsa_card.platform-hdmi0-sound" }
    ]
    actions = {
      update-props = {
        device.description = "HDMI Output"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.platform-hdmi0-sound.*" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI"
        device.profile.description = "HDMI"
        node.nick = "hdmi"
      }
    }
  }
]
EOF
	cat > "$SDCARD/etc/wireplumber/wireplumber.conf.d/52-skysi-default.conf" <<'EOF'
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-analog-sound.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1200
        priority.driver  = 1200
      }
    }
  }
]
EOF

	# Login autostart: activate Speaker/Headphone output profile
	mkdir -p "$SDCARD/usr/local/bin" "$SDCARD/etc/systemd/user/default.target.wants"
	cat > "$SDCARD/usr/local/bin/skysi-audio-default.sh" <<'EOF'
#!/bin/bash
# Skysi X5: 每次登录后激活 "Speaker / Headphone"(组合剖面、设默认),并应用 L/R 平衡。
# 右声道(硬件)偏小 → 用 codec HPR 音量补偿;name 形式 cset,避免依赖 numid。
set -u
CARD=alsa_card.platform-analog-sound
SINK=alsa_output.platform-analog-sound.stereo-fallback

# 等待声卡出现(最长 ~10s)
for i in $(seq 1 40); do
	if pactl list cards short 2>/dev/null | grep -q "$CARD"; then
		break
	fi
	sleep 0.25
done

# 激活 输出+输入 组合剖面(扬声器/耳机 + 麦克风)
pactl set-card-profile "$CARD" output:stereo-fallback+input:stereo-fallback 2>/dev/null
sleep 0.5
# 设为默认
pactl set-default-sink "$SINK" 2>/dev/null

# L/R 均衡:右喇叭偏小,用 codec HPL/HPR 音量补偿
amixer -c 1 cset 'HPL Playback Volume' 152 2>/dev/null
amixer -c 1 cset 'HPR Playback Volume' 160 2>/dev/null

exit 0
EOF
	chmod +x "$SDCARD/usr/local/bin/skysi-audio-default.sh"
	cat > "$SDCARD/etc/systemd/user/skysi-audio-default.service" <<'EOF'
[Unit]
Description=Skysi X5: activate Speaker/Headphone as default output
After=pipewire.service wireplumber.service
Requires=pipewire.service

[Service]
Type=oneshot
ExecStart=/usr/local/bin/skysi-audio-default.sh
RemainAfterExit=yes

[Install]
WantedBy=default.target
EOF
	ln -sf ../skysi-audio-default.service "$SDCARD/etc/systemd/user/default.target.wants/skysi-audio-default.service"
	return 0
}

